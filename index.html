
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Sound World</title>

<style>
:root {
  --paper: #f4f0e7;
  --ink: #292821;
  --muted: #6f6b60;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: var(--paper);
  color: var(--ink);
}

body {
  font-family: Georgia, serif;
  overflow: hidden;
}

.world {
  position: relative;
  width: 100%;
  height: 100svh;
  min-height: 520px;
  overflow: hidden;
  background-image:
    radial-gradient(rgba(41,40,33,.10) .7px, transparent .7px);
  background-size: 14px 14px;
}

.topline {
  position: absolute;
  z-index: 3;
  top: 22px;
  left: 24px;
  right: 24px;
  display: flex;
  justify-content: space-between;
  gap: 18px;
}

.heading {
  font-size: clamp(22px,3vw,38px);
  line-height: .95;
  letter-spacing: -.04em;
}

.sub {
  margin-top: 8px;
  max-width: 270px;
  font: 12px/1.4 Arial,sans-serif;
  color: var(--muted);
}

.sound-toggle {
  border: 1px solid var(--ink);
  border-radius: 99px;
  padding: 10px 15px;
  background: var(--paper);
  color: var(--ink);
  font: 11px Arial,sans-serif;
  cursor: pointer;
}

.object {
  position: absolute;
  width: clamp(92px,13vw,170px);
  aspect-ratio: 1;
  border: 0;
  padding: 8px;
  background: transparent;
  cursor: pointer;
  display: grid;
  place-items: center;
  transform: translate(-50%,-50%);
  animation: drift var(--duration,13s)
    ease-in-out infinite alternate;
}

.object img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(2px 4px 0 rgba(41,40,33,.08));
  transition: transform .25s ease;
  pointer-events: none;
}

.object:hover img {
  transform: scale(1.12) rotate(-4deg);
}

.object .hint {
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  opacity: 0;
  font: 10px Arial,sans-serif;
  text-transform: uppercase;
  transition: opacity .2s;
}

.object:hover .hint {
  opacity: 1;
}

@keyframes drift {
  from {
    translate: -7px -9px;
    rotate: -5deg;
  }
  to {
    translate: 9px 12px;
    rotate: 6deg;
  }
}

.caption {
  position: absolute;
  left: 24px;
  bottom: 22px;
  font: 11px/1.45 Arial,sans-serif;
  color: var(--muted);
}

.modal {
  position: absolute;
  z-index: 5;
  inset: 0;
  display: none;
  place-items: center;
  padding: 20px;
  background: rgba(244,240,231,.76);
  backdrop-filter: blur(5px);
}

.modal.open {
  display: grid;
}

.panel {
  position: relative;
  width: min(420px,100%);
  padding: 28px;
  border: 1px solid var(--ink);
  background: var(--paper);
  box-shadow: 7px 7px 0 rgba(41,40,33,.12);
}

.close {
  position: absolute;
  top: 12px;
  right: 14px;
  border: 0;
  background: none;
  font-size: 24px;
  cursor: pointer;
}

.panel h2 {
  margin: 0 28px 10px 0;
  font-size: 32px;
  font-weight: normal;
}

.panel p {
  font: 13px/1.6 Arial,sans-serif;
  color: var(--muted);
}

.panel .play {
  margin-top: 8px;
  border: 1px solid var(--ink);
  background: transparent;
  padding: 10px 14px;
  cursor: pointer;
}

.start {
  position: absolute;
  z-index: 8;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(244,240,231,.92);
}

.start.hidden {
  display: none;
}

.start-card {
  max-width: 360px;
  text-align: center;
}

.start-card h1 {
  font-size: clamp(34px,7vw,58px);
  font-weight: normal;
  line-height: .9;
}

.start-card p {
  font: 12px/1.55 Arial,sans-serif;
  color: var(--muted);
}

.start-card button {
  border: 1px solid var(--ink);
  border-radius: 99px;
  background: var(--ink);
  color: var(--paper);
  padding: 13px 20px;
  cursor: pointer;
}

@media (max-width:600px) {
  .object {
    width: clamp(86px,25vw,130px);
  }

  .topline {
    top: 16px;
    left: 16px;
    right: 16px;
  }
}

@media (prefers-reduced-motion:reduce) {
  .object { animation: none; }
}
</style>
</head>

<body>

<main class="world" id="world">

<header class="topline">
  <div>
    <div class="heading">
      Little Sound<br>World
    </div>
    <div class="sub">
      A tiny atlas of things that make a noise.
      Wander, listen, and open a little story.
    </div>
  </div>

  <button class="sound-toggle" id="soundToggle">
    SOUND: ON
  </button>
</header>

<!-- OBJECT 1 -->
<button class="object"
  style="left:22%;top:36%;--duration:11s"
  data-id="moth">
  <img src="assets/moth.gif" alt="Moth illustration">
  <span class="hint">open the moth</span>
</button>

<!-- OBJECT 2 -->
<button class="object"
  style="left:51%;top:29%;--duration:14s"
  data-id="bell">
  <img src="assets/bell.gif" alt="Bell illustration">
  <span class="hint">open the bell</span>
</button>

<!-- OBJECT 3 -->
<button class="object"
  style="left:76%;top:48%;--duration:12s"
  data-id="shell">
  <img src="assets/shell.gif" alt="Shell illustration">
  <span class="hint">open the shell</span>
</button>

<!-- OBJECT 4 -->
<button class="object"
  style="left:35%;top:70%;--duration:16s"
  data-id="eye">
  <img src="assets/eye.gif" alt="Eye illustration">
  <span class="hint">open the eye</span>
</button>

<!-- OBJECT 5 -->
<button class="object"
  style="left:68%;top:78%;--duration:10s"
  data-id="seed">
  <img src="assets/seed.gif" alt="Seed illustration">
  <span class="hint">open the seed</span>
</button>

<div class="caption">
  Hover over an object to hear it.<br>
  Click to discover what it is.
</div>

<!-- POPUP -->
<section class="modal" id="modal">
  <div class="panel">
    <button class="close" id="closeModal">×</button>
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <button class="play" id="playAgain">
      PLAY SOUND AGAIN ↗
    </button>
  </div>
</section>

<!-- WELCOME SCREEN -->
<section class="start" id="startScreen">
  <div class="start-card">
    <h1>Enter the<br>sound world</h1>
    <p>
      Turn your sound on, then hover over
      the floating drawings. Click any object
      to open its little story.
    </p>
    <button id="enterButton">
      ENTER WITH SOUND ↗
    </button>
  </div>
</section>

</main>

<script>

// EDIT YOUR OBJECTS HERE

const ITEMS = {

  moth: {
    title: "The Moth",
    text: "A small night visitor, drawn toward the light.",
    sound: "assets/moth.mp3"
  },

  bell: {
    title: "The Bell",
    text: "A little ring that travels farther than you expect.",
    sound: "assets/bell.mp3"
  },

  shell: {
    title: "The Shell",
    text: "A pocket-sized echo from somewhere near the sea.",
    sound: "assets/shell.mp3"
  },

  eye: {
    title: "The Eye",
    text: "A watcher from the edge of the map.",
    sound: "assets/eye.mp3"
  },

  seed: {
    title: "The Seed",
    text: "A quiet beginning with a sound of its own.",
    sound: "assets/seed.mp3"
  }

};

const audio = new Audio();
audio.preload = "auto";

let soundEnabled = true;
let activeItem = null;

// PLAY SOUND

function playItem(id) {

  if (!soundEnabled) return;

  const item = ITEMS[id];

  if (!item || !item.sound) return;

  audio.pause();
  audio.currentTime = 0;
  audio.src = item.sound;

  audio.play().catch(() => {});

}

// STOP SOUND

function stopSound() {
  audio.pause();
  audio.currentTime = 0;
}

// HOVER AND CLICK EVENTS

document.querySelectorAll(".object").forEach(el => {

  const id = el.dataset.id;

  el.addEventListener("mouseenter", () => {
    playItem(id);
  });

  el.addEventListener("mouseleave", stopSound);

  el.addEventListener("click", () => {

    activeItem = id;

    const item = ITEMS[id];

    document.getElementById("modalTitle")
      .textContent = item.title;

    document.getElementById("modalText")
      .textContent = item.text;

    document.getElementById("modal")
      .classList.add("open");

    stopSound();

  });

});

// CLOSE POPUP

document.getElementById("closeModal")
  .addEventListener("click", () => {
    document.getElementById("modal")
      .classList.remove("open");
  });

document.getElementById("modal")
  .addEventListener("click", e => {
    if (e.target.id === "modal") {
      e.currentTarget.classList.remove("open");
    }
  });

// PLAY SOUND AGAIN

document.getElementById("playAgain")
  .addEventListener("click", () => {
    if (activeItem) playItem(activeItem);
  });

// SOUND ON/OFF

document.getElementById("soundToggle")
  .addEventListener("click", e => {

    soundEnabled = !soundEnabled;

    e.currentTarget.textContent =
      soundEnabled ? "SOUND: ON" : "SOUND: OFF";

    if (!soundEnabled) stopSound();

  });

// ENABLE SOUND SCREEN

document.getElementById("enterButton")
  .addEventListener("click", () => {

    document.getElementById("startScreen")
      .classList.add("hidden");

    soundEnabled = true;

    document.getElementById("soundToggle")
      .textContent = "SOUND: ON";

  });

</script>

</body>
</html>
